name: jellyfin-suggestions-idor

services:
  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:12.2}
    ports:
      - "127.0.0.1:18790:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media/private-a:/media/private-a:ro
      - ./media/public-b:/media/public-b:ro
    environment:
      TZ: UTC
    labels:
      lab: JELLYFIN-SUGGESTIONS-IDOR
    restart: "no"

volumes:
  jellyfin-config:
  jellyfin-cache:
